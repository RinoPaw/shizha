<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>识诈</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css', v='20260520-antifraud-selectstable') }}" />
  </head>
  <body>
    <div class="scroll-surface">
      <!-- 挂轴：数字人 -->
      <section class="hanging-scroll" aria-label="数字人识诈">
        <div class="scroll-rod"></div>
        <div class="scroll-body">
          <img
            id="digitalHumanImg"
            class="scroll-video is-active"
            src="{{ url_for('static', filename='media/熊猫警官.jpg') }}"
            alt="熊猫警官"
          />
          <div class="scroll-inscription">
              <span class="seal-mark">识</span>
            <div class="inscription-text">
              <h1>识诈</h1>
              <p id="metaText">案例库已就绪</p>
            </div>
            <div class="figure-caption">
              <span id="digitalHumanStatus">待机</span>
              <span id="digitalHumanSpeech" class="caption-line">你好，我们一起来拆解骗局。</span>
            </div>
          </div>
        </div>
        <div class="scroll-rod bottom-rod"></div>
      </section>

      <!-- 问页：问答 -->
      <section class="ask-leaf">
        <header class="leaf-head">
          <span class="leaf-kicker">问</span>
          <span class="leaf-title">向识诈提问</span>
          <span id="versionBadge" class="version-badge">v0.1.0</span>
          <span id="answerMode" class="leaf-badge" hidden></span>
        </header>
        <div class="leaf-body">
          <textarea id="questionInput" rows="2" placeholder="例如：推荐适合校园宣讲的典型诈骗案例"></textarea>
          <div class="query-helper" aria-label="猜你想搜">
            <span class="query-helper-label">猜你想搜</span>
            <div id="querySuggestions" class="query-suggestions"></div>
          </div>
          <div class="ask-row">
            <button id="voiceToggle" class="voice-button" type="button" title="播放或停止语音播报" aria-pressed="false" data-state="idle">
              <span class="voice-icon" aria-hidden="true">
                <span class="voice-glyph"></span>
              </span>
              <span class="voice-label">播放</span>
            </button>
            <button id="recordButton" class="record-button" type="button" title="按住说话" data-state="idle">
              <span class="record-icon" aria-hidden="true">
                <span class="record-glyph"></span>
              </span>
              <span class="record-label">说话</span>
            </button>
            <span id="voiceStatus" class="voice-hint"></span>
            <button id="askButton" type="button">提问</button>
          </div>
          <div class="answer-scroll is-idle" id="answerBox">
            <span class="idle-hint">等你发问。</span>
          </div>
        </div>
      </section>

      <!-- 批注：资料检索 / 详情 -->
      <aside class="marginalia">
        <div id="searchMode">
          <header class="marginalia-head">
            <span class="marginalia-kicker">注</span>
            <span id="relatedTitle" class="marginalia-title">案例检索</span>
            <span id="relatedCount" class="marginalia-count"></span>
          </header>
          <div class="marginalia-search">
            <input type="text" id="rightSearchInput" placeholder="输入关键词，或直接按条件查询…" />
            <div class="marginalia-filters" aria-label="案例条件">
              <label class="filter-field" aria-label="分类">
                <select id="filterCategory">
                  <option value="">全部分类</option>
                </select>
              </label>
              <label class="filter-field" aria-label="风险等级">
                <select id="filterRiskLevel">
                  <option value="">全部等级</option>
                </select>
              </label>
              <label class="filter-field" aria-label="入口渠道">
                <select id="filterEntryChannel">
                  <option value="">全部渠道</option>
                </select>
              </label>
            </div>
            <button id="rightSearchButton" type="button">查询</button>
          </div>
          <div class="marginalia-list" id="relatedList">
            <p class="marginalia-empty">输入关键词，或选择多个条件查询案例</p>
          </div>
        </div>
        <div id="detailMode" class="marginalia-detail" hidden>
          <button id="backToSearch" class="detail-back" type="button">← 返回</button>
          <span class="detail-cat" id="detailCategory"></span>
          <h2 id="detailTitle"></h2>
          <div class="detail-meta-row" id="detailMeta"></div>
          <p id="detailSupport" class="detail-support" hidden></p>
          <p id="detailBody" class="detail-body"></p>
        </div>
      </aside>
    </div>

    <script src="{{ url_for('static', filename='vendor/purify.min.js', v='3.4.2') }}"></script>
    <script src="{{ url_for('static', filename='vendor/marked.umd.js', v='18.0.3') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/main.js', v='20260520-antifraud-selectstable') }}"></script>
  </body>
</html>
